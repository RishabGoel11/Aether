version: "3.8"

services:
  aether:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether-platform
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - AETHER_HOST=0.0.0.0
      - AETHER_PORT=8000
    volumes:
      - ./data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: aether-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_storage:
